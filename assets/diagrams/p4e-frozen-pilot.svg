<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">P4-E frozen ALFWorld selective Memory pilot</title>
  <desc id="desc">An eight-game frozen pilot showed zero successes for both baseline and selective memory. Repeated actions dropped from 207 to 169 but are not interpreted as an efficacy signal.</desc>
  <style>
    text { font-family: Arial, PingFang SC, Microsoft YaHei, sans-serif; fill: #172033; }
    .title { font-size: 42px; font-weight: 700; } .sub { font-size: 22px; fill: #64748b; }
    .card { fill: #fff; stroke: #d7dfeb; stroke-width: 3; } .warn { fill: #fff7ed; stroke: #f59e0b; stroke-width: 3; }
    .neutral { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 3; } .memory { fill: #ecfdf5; stroke: #34d399; stroke-width: 3; }
    .label { font-size: 25px; font-weight: 700; } .value { font-size: 50px; font-weight: 700; } .body { font-size: 21px; fill: #475569; } .note { font-size: 20px; fill: #92400e; }
  </style>
  <rect width="1600" height="850" fill="#f8fafc"/><rect x="35" y="35" width="1530" height="780" rx="34" class="card"/>
  <text x="90" y="115" class="title">P4-E · 冻结 ALFWorld 选择性 Memory 因果试点</text>
  <text x="90" y="155" class="sub">8 个公开 holdout 游戏 · 同模型 / 同解码 / 顺序交错 · 30 步上限</text>
  <rect x="100" y="225" width="570" height="310" rx="28" class="neutral"/>
  <text x="385" y="290" text-anchor="middle" class="label">Baseline</text><text x="385" y="385" text-anchor="middle" class="value" fill="#475569">0 / 8</text>
  <text x="385" y="430" text-anchor="middle" class="body">成功 · 0.0%</text><text x="385" y="485" text-anchor="middle" class="body">重复动作：207</text>
  <rect x="930" y="225" width="570" height="310" rx="28" class="memory"/>
  <text x="1215" y="290" text-anchor="middle" class="label">Selective Memory</text><text x="1215" y="385" text-anchor="middle" class="value" fill="#059669">0 / 8</text>
  <text x="1215" y="430" text-anchor="middle" class="body">成功 · 0.0%</text><text x="1215" y="485" text-anchor="middle" class="body">重复动作：169（-38）</text>
  <path d="M710 380 H890" stroke="#94a3b8" stroke-width="5"/><path d="M890 380 L865 365 V395 Z" fill="#94a3b8"/>
  <rect x="120" y="625" width="1360" height="115" rx="22" class="warn"/>
  <text x="160" y="675" class="label">正确结论：未观察到成功率效应</text>
  <text x="160" y="715" class="note">重复动作减少只是过程代理；在 0 / 8 成功且样本极小的情况下，不能解释为 Memory 有效。</text>
  <text x="100" y="785" class="sub">下一门槛：先验证 baseline 取得非零成功，再固定更大 holdout、至少两个 seed，并完整报告纠正、回退与 false transfer。</text>
</svg>
